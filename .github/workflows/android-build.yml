name: LordWar Android RC Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "bootstrap/**"
      - ".github/workflows/android-build.yml"

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      GODOT_VERSION: "4.7.2"
      GODOT_TEMPLATE_DIR: "4.7.2.stable.mono"
      EXPECTED_SOURCE_SHA256: "365e4a1c7557f8cf605f6d0d177a7eb531b88822e44dbcde3b28ec7f07c32657"

    steps:
      - name: Checkout bootstrap
        uses: actions/checkout@v4

      - name: Reconstruct R32 source archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _buildsrc
          cat bootstrap/r32_*.b64 | tr -d '\n\r' | base64 -d > _buildsrc/lordwar-r32.tar.gz
          echo "$EXPECTED_SOURCE_SHA256  _buildsrc/lordwar-r32.tar.gz" | sha256sum -c -
          mkdir -p project
          tar -xzf _buildsrc/lordwar-r32.tar.gz -C project
          echo "Reconstructed source files: $(find project -type f | wc -l)"

      - name: Apply Android startup crash fix overlay
        shell: bash
        run: |
          set -euo pipefail
          cp bootstrap/overrides/LordWarApp.cs project/Scripts/Godot/LordWarApp.cs
          grep -F "LORDWAR_STARTUP_OK" project/Scripts/Godot/LordWarApp.cs

      - name: Set Android RC version and universal architectures
        shell: bash
        working-directory: project
        run: |
          sed -i -E 's/version\/code=[0-9]+/version\/code=90102/' export_presets.cfg
          sed -i -E 's/version\/name="[^"]*"/version\/name="1.0.0-rc3"/' export_presets.cfg
          sed -i 's/architectures\/x86_64=false/architectures\/x86_64=true/' export_presets.cfg
          sed -i 's/"GL Compatibility"/"Mobile"/g' project.godot
          sed -i 's/renderer\/rendering_method="gl_compatibility"/renderer\/rendering_method="mobile"/g' project.godot
          sed -i 's/renderer\/rendering_method.mobile="gl_compatibility"/renderer\/rendering_method.mobile="mobile"/g' project.godot
          echo "Renderer switched to Mobile/Vulkan for Android native-driver stability"
          grep -E 'renderer/rendering_method|config/features' project.godot
          grep -E 'version/(code|name)|architectures/(arm64-v8a|x86_64)' export_presets.cfg

      - name: Verify full runtime art payload
        shell: bash
        working-directory: project
        run: |
          PNG_COUNT=$(find Art/LordWarArt -type f -iname '*.png' | wc -l)
          echo "runtime_png=$PNG_COUNT"
          test "$PNG_COUNT" -ge 1655

      - name: Verify Android texture import setting
        shell: bash
        working-directory: project
        run: |
          grep -F "textures/vram_compression/import_etc2_astc=true" project.godot

      - name: Setup .NET 8 and 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android command line tools
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="$HOME/android-sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fL --retry 5 --retry-delay 3 \
            "https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip" \
            -o /tmp/android-cmdline.zip
          rm -rf /tmp/android-cmdline
          mkdir -p /tmp/android-cmdline
          unzip -q /tmp/android-cmdline.zip -d /tmp/android-cmdline
          rm -rf "$ANDROID_HOME/cmdline-tools/latest"
          mv /tmp/android-cmdline/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"

      - name: Install Android SDK packages required by Godot 4.7
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "build-tools;35.0.1" \
            "platforms;android-35" \
            "cmdline-tools;latest" \
            "cmake;3.10.2.4988404" \
            "ndk;28.1.13356709" \
            "emulator" \
            "system-images;android-35;google_apis;x86_64"

      - name: Install Godot 4.7.2 .NET editor
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/godot" "$HOME/bin"
          curl -fL --retry 5 --retry-delay 3 \
            "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_mono_linux_x86_64.zip" \
            -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d "$HOME/godot"
          GODOT_BIN=$(find "$HOME/godot" -type f -perm -111 -name 'Godot*' -print -quit)
          if [ -z "$GODOT_BIN" ]; then
            echo "Godot executable not found after unzip"
            find "$HOME/godot" -maxdepth 3 -type f -o -type d
            exit 1
          fi
          test -n "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          ln -sf "$GODOT_BIN" "$HOME/bin/godot"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          ls -lah "$HOME/bin/godot"
          "$HOME/bin/godot" --version

      - name: Install matching Godot .NET export templates
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 5 --retry-delay 3 \
            "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_mono_export_templates.tpz" \
            -o /tmp/templates.tpz
          rm -rf /tmp/godot-templates
          mkdir -p /tmp/godot-templates
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          TARGET="$HOME/.local/share/godot/export_templates/$GODOT_TEMPLATE_DIR"
          mkdir -p "$TARGET"
          if [ -d /tmp/godot-templates/templates ]; then
            cp -a /tmp/godot-templates/templates/. "$TARGET/"
          else
            cp -a /tmp/godot-templates/. "$TARGET/"
          fi
          test -f "$TARGET/android_debug.apk"
          test -f "$TARGET/android_release.apk"
          echo "$GODOT_TEMPLATE_DIR" > "$TARGET/version.txt"

      - name: Restore persistent debug signing key
        id: signing_cache
        uses: actions/cache@v4
        with:
          path: ~/.android/lordwar-ci-debug.keystore
          key: lordwar-debug-signing-v1

      - name: Create persistent debug signing key if missing
        if: steps.signing_cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v \
            -keystore "$HOME/.android/lordwar-ci-debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=LordWar CI,O=LordWar,C=CN" \
            -keyalg RSA -keysize 2048 -validity 10000

      - name: Configure persistent debug signing
        shell: bash
        run: |
          test -s "$HOME/.android/lordwar-ci-debug.keystore"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/.android/lordwar-ci-debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$HOME/.android/lordwar-ci-debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Verify toolchain
        shell: bash
        run: |
          dotnet --info
          "$HOME/bin/godot" --version
          java -version
          sdkmanager --version
          adb --version
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "JAVA_HOME=$JAVA_HOME"

      - name: Static project verification
        shell: bash
        working-directory: project
        run: |
          mkdir -p Evidence
          python3 Tools/static_verify.py 2>&1 | tee Evidence/CI_STATIC_VERIFY.log
          if [ -f Tools/r32_verify.py ]; then
            python3 Tools/r32_verify.py 2>&1 | tee Evidence/CI_R32_VERIFY.log
          fi

      - name: Generate Godot C# solution
        shell: bash
        working-directory: project
        run: |
          set -euo pipefail
          rm -f LordWar.sln
          dotnet new sln -n LordWar
          dotnet sln LordWar.sln add LordWar.csproj
          test -s LordWar.sln
          grep -F "LordWar.csproj" LordWar.sln

      - name: Create required Godot C# solution
        shell: bash
        working-directory: project
        run: |
          set -euo pipefail
          rm -f LordWar.sln LordWar.slnx
          dotnet new sln -n LordWar --format sln
          dotnet sln LordWar.sln add LordWar.csproj
          test -s LordWar.sln
          grep -F "LordWar.csproj" LordWar.sln
          echo "GODOT_CSHARP_SOLUTION=PASS"

      - name: Restore and build C#
        shell: bash
        working-directory: project
        run: |
          rm -f LordWar.sln
          dotnet new sln -n LordWar --force
          dotnet sln LordWar.sln add LordWar.csproj
          test -s LordWar.sln
          dotnet restore LordWar.sln 2>&1 | tee Evidence/CI_DOTNET_RESTORE.log
          dotnet build LordWar.sln -c Debug --no-restore 2>&1 | tee Evidence/CI_DOTNET_BUILD.log

      - name: Import Godot project
        shell: bash
        working-directory: project
        run: |
          "$HOME/bin/godot" --headless --editor --quit --path . --verbose 2>&1 | tee Evidence/CI_GODOT_IMPORT.log

      - name: Headless runtime startup smoke test
        shell: bash
        working-directory: project
        run: |
          set -euo pipefail
          LORDWAR_SMOKE_TEST=1 timeout 60s "$HOME/bin/godot" --headless --path . --verbose 2>&1 | tee Evidence/CI_RUNTIME_SMOKE.log
          if grep -F "LORDWAR_STARTUP_FATAL" Evidence/CI_RUNTIME_SMOKE.log; then
            echo "Startup fatal marker detected"
            exit 1
          fi
          grep -F "LORDWAR_STARTUP_OK" Evidence/CI_RUNTIME_SMOKE.log

      - name: Switch Android export to Vulkan Mobile renderer
        shell: bash
        working-directory: project
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("project.godot")
          s = p.read_text(encoding="utf-8")
          s = s.replace('config/features=PackedStringArray("4.7", "C#", "GL Compatibility")',
                        'config/features=PackedStringArray("4.7", "C#", "Mobile")')
          s = s.replace('renderer/rendering_method="gl_compatibility"',
                        'renderer/rendering_method="mobile"')
          s = s.replace('renderer/rendering_method.mobile="gl_compatibility"',
                        'renderer/rendering_method.mobile="mobile"')
          s = s.replace('handheld/orientation=1', 'handheld/orientation=0')
          if 'rendering/rendering_device/driver.android="vulkan"' not in s:
              s = s.replace('[rendering]\n', '[rendering]\nrendering/rendering_device/driver.android="vulkan"\n', 1)
          p.write_text(s, encoding="utf-8")
          e = Path("export_presets.cfg")
          t = e.read_text(encoding="utf-8")
          t = t.replace('command_line/extra_args=""',
                        'command_line/extra_args="--rendering-method mobile --rendering-driver vulkan"')
          e.write_text(t, encoding="utf-8")
          PY
          grep -E 'config/features|rendering_method|driver.android|handheld/orientation' project.godot
          grep -F 'command_line/extra_args' export_presets.cfg
          test -s LordWar.sln

      - name: Export Android debug APK
        shell: bash
        working-directory: project
        run: |
          mkdir -p Builds/Android
          godot --headless --path . \
            --export-debug "Android Debug" \
            "Builds/Android/LordWar-RC3-debug.apk" \
            --verbose 2>&1 | tee Evidence/CI_ANDROID_EXPORT.log
          test -s Builds/Android/LordWar-RC3-debug.apk
          sha256sum Builds/Android/LordWar-RC3-debug.apk | tee Builds/Android/LordWar-RC3-debug.apk.sha256
          ls -lh Builds/Android/

      - name: Android emulator install and launch smoke test
        shell: bash
        working-directory: project
        run: |
          set -euo pipefail
          mkdir -p Evidence
          sudo chmod 666 /dev/kvm 2>/dev/null || true
          echo "no" | avdmanager create avd -n LordWarApi35 -k "system-images;android-35;google_apis;x86_64" --force
          nohup emulator -avd LordWarApi35 -no-window -noaudio -no-boot-anim -gpu swiftshader_indirect -feature Vulkan -memory 2048 > Evidence/CI_EMULATOR_BOOT.log 2>&1 &
          adb wait-for-device
          BOOT_OK=0
          for i in $(seq 1 120); do
            if [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then BOOT_OK=1; break; fi
            sleep 2
          done
          test "$BOOT_OK" = "1"
          adb install -r Builds/Android/LordWar-RC3-debug.apk | tee Evidence/CI_ADB_INSTALL.log
          adb logcat -c || true
          adb shell am force-stop com.lordwar.game || true
          adb shell monkey -p com.lordwar.game -c android.intent.category.LAUNCHER 1 | tee Evidence/CI_ANDROID_LAUNCH.log
          sleep 4
          adb shell input tap 520 200 || true
          STARTUP_OK=0
          for i in $(seq 1 90); do
            PID="$(adb shell pidof com.lordwar.game | tr -d '\r' || true)"
            if [ -z "$PID" ]; then break; fi
            if adb logcat -d -v brief | grep -F "LORDWAR_STARTUP_OK" >/dev/null; then STARTUP_OK=1; break; fi
            sleep 2
          done
          PID="$(adb shell pidof com.lordwar.game | tr -d '\r' || true)"
          adb logcat -d -v threadtime > Evidence/CI_ANDROID_DEVICE_LOGCAT.log || true
          echo "pid=$PID" | tee Evidence/CI_ANDROID_DEVICE_STATUS.txt
          echo "startup_ok=$STARTUP_OK" | tee -a Evidence/CI_ANDROID_DEVICE_STATUS.txt
          grep -F "LORDWAR_STARTUP" Evidence/CI_ANDROID_DEVICE_LOGCAT.log | tail -n 100 | tee -a Evidence/CI_ANDROID_DEVICE_STATUS.txt || true
          if [ -z "$PID" ] || [ "$STARTUP_OK" != "1" ]; then
            echo "ANDROID_DEVICE_SMOKE=FAIL" | tee -a Evidence/CI_ANDROID_DEVICE_STATUS.txt
            grep -E "FATAL EXCEPTION|Fatal signal|SIGSEGV|SIGABRT|LORDWAR_STARTUP_FATAL|godot.*ERROR" Evidence/CI_ANDROID_DEVICE_LOGCAT.log | tail -n 250 || true
            exit 1
          fi
          sleep 5
          adb exec-out screencap -p > Evidence/CI_ANDROID_DEVICE_SCREEN.png
          test "$(stat -c%s Evidence/CI_ANDROID_DEVICE_SCREEN.png)" -gt 5000
          sleep 10
          PID2="$(adb shell pidof com.lordwar.game | tr -d '\r' || true)"
          test -n "$PID2"
          echo "ANDROID_DEVICE_SMOKE=PASS" | tee -a Evidence/CI_ANDROID_DEVICE_STATUS.txt

      - name: Export signed Android RC release APK
        shell: bash
        working-directory: project
        run: |
          set -euo pipefail
          "$HOME/bin/godot" --headless --path . \
            --export-release "Android Debug" \
            "Builds/Android/LordWar-1.0.0-RC3.apk" \
            --verbose 2>&1 | tee Evidence/CI_ANDROID_RELEASE_EXPORT.log
          test -s Builds/Android/LordWar-1.0.0-RC3.apk
          sha256sum Builds/Android/LordWar-1.0.0-RC3.apk | tee Builds/Android/LordWar-1.0.0-RC3.apk.sha256

      - name: Android emulator RC release smoke test
        shell: bash
        working-directory: project
        run: |
          set -euo pipefail
          adb wait-for-device
          adb install -r Builds/Android/LordWar-1.0.0-RC3.apk | tee Evidence/CI_ADB_RELEASE_INSTALL.log
          adb logcat -c || true
          adb shell am force-stop com.lordwar.game || true
          adb shell monkey -p com.lordwar.game -c android.intent.category.LAUNCHER 1 | tee Evidence/CI_ANDROID_RELEASE_LAUNCH.log
          sleep 4
          adb shell input tap 520 200 || true
          STARTUP_OK=0
          for i in $(seq 1 90); do
            PID="$(adb shell pidof com.lordwar.game | tr -d '\r' || true)"
            if [ -z "$PID" ]; then break; fi
            if adb logcat -d -v brief | grep -F "LORDWAR_STARTUP_OK" >/dev/null; then STARTUP_OK=1; break; fi
            sleep 2
          done
          PID="$(adb shell pidof com.lordwar.game | tr -d '\r' || true)"
          adb logcat -d -v threadtime > Evidence/CI_ANDROID_RELEASE_LOGCAT.log || true
          echo "pid=$PID" | tee Evidence/CI_ANDROID_RELEASE_STATUS.txt
          echo "startup_ok=$STARTUP_OK" | tee -a Evidence/CI_ANDROID_RELEASE_STATUS.txt
          grep -F "LORDWAR_STARTUP" Evidence/CI_ANDROID_RELEASE_LOGCAT.log | tail -n 100 | tee -a Evidence/CI_ANDROID_RELEASE_STATUS.txt || true
          if [ -z "$PID" ] || [ "$STARTUP_OK" != "1" ]; then
            echo "ANDROID_RELEASE_SMOKE=FAIL" | tee -a Evidence/CI_ANDROID_RELEASE_STATUS.txt
            grep -E "FATAL EXCEPTION|Fatal signal|SIGSEGV|SIGABRT|LORDWAR_STARTUP_FATAL|godot.*ERROR" Evidence/CI_ANDROID_RELEASE_LOGCAT.log | tail -n 250 || true
            exit 1
          fi
          sleep 5
          adb exec-out screencap -p > Evidence/CI_ANDROID_RELEASE_SCREEN.png
          test "$(stat -c%s Evidence/CI_ANDROID_RELEASE_SCREEN.png)" -gt 5000
          sleep 10
          PID2="$(adb shell pidof com.lordwar.game | tr -d '\r' || true)"
          test -n "$PID2"
          echo "ANDROID_RELEASE_SMOKE=PASS" | tee -a Evidence/CI_ANDROID_RELEASE_STATUS.txt

      - name: Build evidence summary
        if: always()
        shell: bash
        working-directory: project
        run: |
          {
            echo "workflow_run=$GITHUB_RUN_ID"
            echo "commit=$GITHUB_SHA"
            echo "godot_version=$GODOT_VERSION"
            echo "source_sha256=$EXPECTED_SOURCE_SHA256"
            echo "timestamp_utc=$(date -u +%FT%TZ)"
            if [ -f Builds/Android/LordWar-RC3-debug.apk ]; then
              echo "apk_present=yes"
              sha256sum Builds/Android/LordWar-RC3-debug.apk
            else
              echo "apk_present=no"
            fi
          } > Evidence/CI_BUILD_SUMMARY.txt
          cat Evidence/CI_BUILD_SUMMARY.txt

      - name: Upload APK, source and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lordwar-r32-android-build
          if-no-files-found: warn
          retention-days: 30
          path: |
            project/Builds/Android/*.apk
            project/Builds/Android/*.sha256
            project/Evidence/CI_*.log
            project/Evidence/CI_*.txt
            project/Evidence/CI_*.png
            project/Evidence/CI_BUILD_SUMMARY.txt
            project/Scripts/Godot/LordWarApp.cs
            project/LordWar.sln
            project/LordWar.sln
            project/LordWar.sln
            project/project.godot
            bootstrap/overrides/LordWarApp.cs
            _buildsrc/lordwar-r32.tar.gz
