name: LordWar R32 Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "bootstrap/**"
      - ".github/workflows/android-build.yml"

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      GODOT_VERSION: "4.7.2"
      GODOT_TEMPLATE_DIR: "4.7.2.stable.mono"
      EXPECTED_SOURCE_SHA256: "712ae15fc44a39b9610e4b4adca8328b7139feca31972cded04f93e73e494b1d"

    steps:
      - name: Checkout bootstrap
        uses: actions/checkout@v4

      - name: Reconstruct R32 source archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _buildsrc
          cat bootstrap/r32_*.b64 | tr -d '\n\r' | base64 -d > _buildsrc/lordwar-r32.tar.gz
          echo "$EXPECTED_SOURCE_SHA256  _buildsrc/lordwar-r32.tar.gz" | sha256sum -c -
          mkdir -p project
          tar -xzf _buildsrc/lordwar-r32.tar.gz -C project
          echo "Reconstructed source files: $(find project -type f | wc -l)"

      - name: Prepare Android texture import compatibility
        shell: bash
        working-directory: project
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("project.godot")
          s = p.read_text(encoding="utf-8")
          key = "textures/vram_compression/import_etc2_astc=true"
          if key not in s:
              marker = "[rendering]\\n"
              if marker in s:
                  s = s.replace(marker, marker + key + "\\n", 1)
              else:
                  s += "\\n[rendering]\\n" + key + "\\n"
              p.write_text(s, encoding="utf-8")
          PY

      - name: Setup .NET 8 and 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android command line tools
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="$HOME/android-sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fL --retry 5 --retry-delay 3 \
            "https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip" \
            -o /tmp/android-cmdline.zip
          rm -rf /tmp/android-cmdline
          mkdir -p /tmp/android-cmdline
          unzip -q /tmp/android-cmdline.zip -d /tmp/android-cmdline
          rm -rf "$ANDROID_HOME/cmdline-tools/latest"
          mv /tmp/android-cmdline/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android SDK packages required by Godot 4.7
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "build-tools;35.0.1" \
            "platforms;android-35" \
            "cmdline-tools;latest" \
            "cmake;3.10.2.4988404" \
            "ndk;28.1.13356709"

      - name: Install Godot 4.7.2 .NET editor
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/godot" "$HOME/bin"
          curl -fL --retry 5 --retry-delay 3 \
            "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_mono_linux_x86_64.zip" \
            -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d "$HOME/godot"
          GODOT_BIN=$(find "$HOME/godot" -type f -perm -111 -name 'Godot*' -print -quit)
          if [ -z "$GODOT_BIN" ]; then
            echo "Godot executable not found after unzip"
            find "$HOME/godot" -maxdepth 3 -type f -o -type d
            exit 1
          fi
          test -n "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          ln -sf "$GODOT_BIN" "$HOME/bin/godot"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          ls -lah "$HOME/bin/godot"
          "$HOME/bin/godot" --version

      - name: Install matching Godot .NET export templates
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 5 --retry-delay 3 \
            "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_mono_export_templates.tpz" \
            -o /tmp/templates.tpz
          rm -rf /tmp/godot-templates
          mkdir -p /tmp/godot-templates
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          TARGET="$HOME/.local/share/godot/export_templates/$GODOT_TEMPLATE_DIR"
          mkdir -p "$TARGET"
          if [ -d /tmp/godot-templates/templates ]; then
            cp -a /tmp/godot-templates/templates/. "$TARGET/"
          else
            cp -a /tmp/godot-templates/. "$TARGET/"
          fi
          test -f "$TARGET/android_debug.apk"
          test -f "$TARGET/android_release.apk"
          echo "$GODOT_TEMPLATE_DIR" > "$TARGET/version.txt"

      - name: Create CI debug keystore
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          rm -f "$HOME/.android/lordwar-ci-debug.keystore"
          keytool -genkeypair -v \
            -keystore "$HOME/.android/lordwar-ci-debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=LordWar CI,O=LordWar,C=CN" \
            -keyalg RSA -keysize 2048 -validity 10000
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/.android/lordwar-ci-debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Verify toolchain
        shell: bash
        run: |
          dotnet --info
          "$HOME/bin/godot" --version
          java -version
          sdkmanager --version
          adb --version
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "JAVA_HOME=$JAVA_HOME"

      - name: Static project verification
        shell: bash
        working-directory: project
        run: |
          mkdir -p Evidence
          python3 Tools/static_verify.py 2>&1 | tee Evidence/CI_STATIC_VERIFY.log
          if [ -f Tools/r32_verify.py ]; then
            python3 Tools/r32_verify.py 2>&1 | tee Evidence/CI_R32_VERIFY.log
          fi

      - name: Restore and build C#
        shell: bash
        working-directory: project
        run: |
          dotnet restore LordWar.csproj 2>&1 | tee Evidence/CI_DOTNET_RESTORE.log
          dotnet build LordWar.csproj -c Release --no-restore 2>&1 | tee Evidence/CI_DOTNET_BUILD.log

      - name: Import Godot project
        shell: bash
        working-directory: project
        run: |
          "$HOME/bin/godot" --headless --editor --quit --path . --verbose 2>&1 | tee Evidence/CI_GODOT_IMPORT.log

      - name: Export Android debug APK
        shell: bash
        working-directory: project
        run: |
          mkdir -p Builds/Android
          godot --headless --path . \
            --export-debug "Android Debug" \
            "Builds/Android/LordWar-R32-debug.apk" \
            --verbose 2>&1 | tee Evidence/CI_ANDROID_EXPORT.log
          test -s Builds/Android/LordWar-R32-debug.apk
          sha256sum Builds/Android/LordWar-R32-debug.apk | tee Builds/Android/LordWar-R32-debug.apk.sha256
          ls -lh Builds/Android/

      - name: Build evidence summary
        if: always()
        shell: bash
        working-directory: project
        run: |
          {
            echo "workflow_run=$GITHUB_RUN_ID"
            echo "commit=$GITHUB_SHA"
            echo "godot_version=$GODOT_VERSION"
            echo "source_sha256=$EXPECTED_SOURCE_SHA256"
            echo "timestamp_utc=$(date -u +%FT%TZ)"
            if [ -f Builds/Android/LordWar-R32-debug.apk ]; then
              echo "apk_present=yes"
              sha256sum Builds/Android/LordWar-R32-debug.apk
            else
              echo "apk_present=no"
            fi
          } > Evidence/CI_BUILD_SUMMARY.txt
          cat Evidence/CI_BUILD_SUMMARY.txt

      - name: Upload APK, source and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lordwar-r32-android-build
          if-no-files-found: warn
          retention-days: 30
          path: |
            project/Builds/Android/*.apk
            project/Builds/Android/*.sha256
            project/Evidence/CI_*.log
            project/Evidence/CI_BUILD_SUMMARY.txt
            _buildsrc/lordwar-r32.tar.gz
