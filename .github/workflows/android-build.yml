name: LordWar 1.0.1 Playable Release Gate

on:
  workflow_dispatch:
  push:
    branches: [ main, "fix/android-gray-screen-vulkan" ]
    paths:
      - "bootstrap/**"
      - ".github/workflows/android-build.yml"

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 140
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      GODOT_VERSION: "4.7.2"
      GODOT_TEMPLATE_DIR: "4.7.2.stable.mono"
      EXPECTED_SOURCE_SHA256: "365e4a1c7557f8cf605f6d0d177a7eb531b88822e44dbcde3b28ec7f07c32657"

    steps:
      - name: Checkout bootstrap
        uses: actions/checkout@v4

      - name: Reconstruct R32 source archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _buildsrc
          cat bootstrap/r32_*.b64 | tr -d '\n\r' | base64 -d > _buildsrc/lordwar-r32.tar.gz
          echo "$EXPECTED_SOURCE_SHA256  _buildsrc/lordwar-r32.tar.gz" | sha256sum -c -
          mkdir -p project
          tar -xzf _buildsrc/lordwar-r32.tar.gz -C project
          echo "Reconstructed source files: $(find project -type f | wc -l)"

      - name: Apply Android startup crash fix overlay
        shell: bash
        run: |
          set -euo pipefail
          cp bootstrap/overrides/LordWarApp.cs project/Scripts/Godot/LordWarApp.cs
          cp bootstrap/overrides/WorldView.cs project/Scripts/Godot/WorldView.cs
          cp bootstrap/overrides/LordWarHud.cs project/Scripts/Godot/LordWarHud.cs
          cp bootstrap/overrides/WorldGenerator.cs project/Scripts/LordWar/World/WorldGenerator.cs
          cp bootstrap/overrides/patch_gles_shader_uniform_limit.py project/Tools/patch_gles_shader_uniform_limit.py
          cat bootstrap/overrides/commander_skills_addendum.csv >> project/Data/LordWarData/commander_skills_v8.csv
          python3 - <<'PY'
          from pathlib import Path
          p=Path("project/Tools/r32_verify.py")
          t=p.read_text(encoding="utf-8").replace("skills_48", "skills_60").replace("commander_skills_v8.csv')==48", "commander_skills_v8.csv')==60")
          p.write_text(t,encoding="utf-8")
          p=Path("project/README_CN.md")
          t=p.read_text(encoding="utf-8").replace("48条统帅技能", "60条统帅技能")
          p.write_text(t,encoding="utf-8")
          p=Path("project/Docs/R32_战争核心设计说明.md")
          t=p.read_text(encoding="utf-8").replace("48条统帅技能", "60条统帅技能").replace("16个战术方向", "20个战术方向")
          p.write_text(t,encoding="utf-8")
          PY
          test "$(python3 -c 'import csv; print(sum(1 for _ in csv.reader(open("project/Data/LordWarData/commander_skills_v8.csv",encoding="utf-8-sig")))-1)')" = 60
          grep -F "LORDWAR_MENU_READY" project/Scripts/Godot/LordWarApp.cs
          grep -F "PriorityQueue<GridPoint, float>" project/Scripts/LordWar/World/WorldGenerator.cs

      - name: Set Android 1.0.1 version and universal architectures
        shell: bash
        working-directory: project
        run: |
          sed -i -E 's/version\/code=[0-9]+/version\/code=90112/' export_presets.cfg
          sed -i -E 's/version\/name="[^"]*"/version\/name="1.0.1"/' export_presets.cfg
          sed -i 's/architectures\/x86_64=false/architectures\/x86_64=true/' export_presets.cfg
          grep -E 'version/(code|name)|architectures/(arm64-v8a|x86_64)' export_presets.cfg
          sed -i 's/handheld\/orientation=[0-9]/handheld\/orientation=0/' project.godot
          if grep -q '^stretch/aspect=' project.godot; then
            sed -i 's/stretch\/aspect="[^"]*"/stretch\/aspect="expand"/' project.godot
          else
            sed -i '/stretch\/mode="canvas_items"/a stretch/aspect="expand"' project.godot
          fi
          python3 - <<'PY'
          from pathlib import Path
          p=Path("project.godot")
          s=p.read_text(encoding="utf-8")
          icon='application/config/icon="res://Art/LordWarArt/人物_动作/iconKingdom__833687149ec4b6b4f925b35b2059cc70__1.png"'
          if 'application/config/icon=' in s:
              import re
              s=re.sub(r'application/config/icon="[^"]*"', icon, s)
          else:
              s=s.replace('[application]\n','[application]\n'+icon+'\n',1)
          p.write_text(s,encoding="utf-8")
          PY
          grep -E 'handheld/orientation|stretch/(mode|aspect)|application/config/icon' project.godot

      - name: Verify full runtime art payload
        shell: bash
        working-directory: project
        run: |
          PNG_COUNT=$(find Art/LordWarArt -type f -iname '*.png' | wc -l)
          echo "runtime_png=$PNG_COUNT"
          test "$PNG_COUNT" -ge 1655

      - name: Verify Android texture import setting
        shell: bash
        working-directory: project
        run: |
          grep -F "textures/vram_compression/import_etc2_astc=true" project.godot

      - name: Setup .NET 8 and 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android command line tools
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="$HOME/android-sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fL --retry 5 --retry-delay 3 \
            "https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip" \
            -o /tmp/android-cmdline.zip
          rm -rf /tmp/android-cmdline
          mkdir -p /tmp/android-cmdline
          unzip -q /tmp/android-cmdline.zip -d /tmp/android-cmdline
          rm -rf "$ANDROID_HOME/cmdline-tools/latest"
          mv /tmp/android-cmdline/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"

      - name: Install Android SDK packages required by Godot 4.7
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "build-tools;35.0.1" \
            "platforms;android-35" \
            "cmdline-tools;latest" \
            "cmake;3.10.2.4988404" \
            "ndk;28.1.13356709" \
            "emulator" \
            "system-images;android-35;google_apis;x86_64"

      - name: Install Godot 4.7.2 .NET editor
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/godot" "$HOME/bin"
          curl -fL --retry 5 --retry-delay 3 \
            "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_mono_linux_x86_64.zip" \
            -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d "$HOME/godot"
          GODOT_BIN=$(find "$HOME/godot" -type f -perm -111 -name 'Godot*' -print -quit)
          if [ -z "$GODOT_BIN" ]; then
            echo "Godot executable not found after unzip"
            find "$HOME/godot" -maxdepth 3 -type f -o -type d
            exit 1
          fi
          test -n "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          ln -sf "$GODOT_BIN" "$HOME/bin/godot"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          ls -lah "$HOME/bin/godot"
          "$HOME/bin/godot" --version

      - name: Install matching Godot .NET export templates
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 5 --retry-delay 3 \
            "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_mono_export_templates.tpz" \
            -o /tmp/templates.tpz
          rm -rf /tmp/godot-templates
          mkdir -p /tmp/godot-templates
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          TARGET="$HOME/.local/share/godot/export_templates/$GODOT_TEMPLATE_DIR"
          mkdir -p "$TARGET"
          if [ -d /tmp/godot-templates/templates ]; then
            cp -a /tmp/godot-templates/templates/. "$TARGET/"
          else
            cp -a /tmp/godot-templates/. "$TARGET/"
          fi
          test -f "$TARGET/android_debug.apk"
          test -f "$TARGET/android_release.apk"
          echo "$GODOT_TEMPLATE_DIR" > "$TARGET/version.txt"

      - name: Restore persistent debug signing key
        id: signing_cache
        uses: actions/cache@v4
        with:
          path: ~/.android/lordwar-ci-debug.keystore
          key: lordwar-debug-signing-v1

      - name: Create persistent debug signing key if missing
        if: steps.signing_cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v \
            -keystore "$HOME/.android/lordwar-ci-debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=LordWar CI,O=LordWar,C=CN" \
            -keyalg RSA -keysize 2048 -validity 10000

      - name: Configure persistent debug signing
        shell: bash
        run: |
          test -s "$HOME/.android/lordwar-ci-debug.keystore"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/.android/lordwar-ci-debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$HOME/.android/lordwar-ci-debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Verify toolchain
        shell: bash
        run: |
          dotnet --info
          "$HOME/bin/godot" --version
          java -version
          sdkmanager --version
          adb --version
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "JAVA_HOME=$JAVA_HOME"

      - name: Static project verification
        shell: bash
        working-directory: project
        run: |
          mkdir -p Evidence
          python3 Tools/static_verify.py 2>&1 | tee Evidence/CI_STATIC_VERIFY.log
          if [ -f Tools/r32_verify.py ]; then
            python3 Tools/r32_verify.py 2>&1 | tee Evidence/CI_R32_VERIFY.log
          fi

      - name: Generate and build Godot C# solution
        shell: bash
        working-directory: project
        run: |
          set -euo pipefail
          rm -f LordWar.sln LordWar.slnx
          dotnet new sln -n LordWar --format sln
          dotnet sln LordWar.sln add LordWar.csproj
          test -s LordWar.sln
          grep -F "LordWar.csproj" LordWar.sln
          dotnet restore LordWar.sln 2>&1 | tee Evidence/CI_DOTNET_RESTORE.log
          dotnet build LordWar.sln -c Debug --no-restore 2>&1 | tee Evidence/CI_DOTNET_BUILD.log
          echo "GODOT_CSHARP_SOLUTION_BUILD=PASS"

      - name: Import Godot project
        shell: bash
        working-directory: project
        run: |
          "$HOME/bin/godot" --headless --editor --quit --path . --verbose 2>&1 | tee Evidence/CI_GODOT_IMPORT.log

      - name: Headless runtime startup smoke test
        shell: bash
        working-directory: project
        run: |
          set -euo pipefail
          set +e
          LORDWAR_SMOKE_TEST=1 timeout 15s "$HOME/bin/godot" --headless --path . --verbose 2>&1 | tee Evidence/CI_RUNTIME_SMOKE.log
          SMOKE_RC=${PIPESTATUS[0]}
          set -e
          if [ "$SMOKE_RC" != "0" ] && [ "$SMOKE_RC" != "124" ]; then
            echo "Unexpected smoke-test process exit: $SMOKE_RC"
            exit "$SMOKE_RC"
          fi
          if grep -F "LORDWAR_STARTUP_FATAL" Evidence/CI_RUNTIME_SMOKE.log; then
            echo "Startup fatal marker detected"
            exit 1
          fi
          grep -F "LORDWAR_MENU_READY" Evidence/CI_RUNTIME_SMOKE.log
          grep -F "LORDWAR_GAME_READY" Evidence/CI_RUNTIME_SMOKE.log

      - name: Keep GLES Compatibility below Android shader uniform limit
        shell: bash
        working-directory: project
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path("project.godot")
          s=p.read_text(encoding="utf-8")
          s=re.sub(r'config/features=PackedStringArray\([^\n]*\)',
                   'config/features=PackedStringArray("4.7", "C#", "GL Compatibility")', s)
          s=re.sub(r'renderer/rendering_method="[^"]*"',
                   'renderer/rendering_method="gl_compatibility"', s)
          s=re.sub(r'renderer/rendering_method.mobile="[^"]*"',
                   'renderer/rendering_method.mobile="gl_compatibility"', s)
          if 'rendering/gl_compatibility/driver.android=' in s:
              s=re.sub(r'rendering/gl_compatibility/driver.android="[^"]*"',
                       'rendering/gl_compatibility/driver.android="opengl3"', s)
          else:
              s=s.replace('[rendering]\n','[rendering]\nrendering/gl_compatibility/driver.android="opengl3"\n',1)
          if 'rendering/limits/opengl/max_lights_per_object=' in s:
              s=re.sub(r'rendering/limits/opengl/max_lights_per_object=[^\n]*',
                       'rendering/limits/opengl/max_lights_per_object=1', s)
          else:
              s=s.replace('[rendering]\n','[rendering]\nrendering/limits/opengl/max_lights_per_object=1\n',1)
          p.write_text(s,encoding="utf-8")
          e=Path("export_presets.cfg")
          t=e.read_text(encoding="utf-8")
          t=re.sub(r'command_line/extra_args="[^"]*"',
                   'command_line/extra_args="--rendering-method gl_compatibility --rendering-driver opengl3"',t)
          e.write_text(t,encoding="utf-8")
          PY
          grep -E 'rendering/limits/opengl/max_lights_per_object|config/features|rendering_method|gl_compatibility/driver.android|handheld/orientation|stretch/aspect' project.godot
          grep -F 'command_line/extra_args' export_presets.cfg
          test -s LordWar.sln
      - name: Export Android debug APK
        shell: bash
        working-directory: project
        run: |
          mkdir -p Builds/Android
          godot --headless --path . \
            --export-debug "Android Debug" \
            "Builds/Android/LordWar-1.0.1-device-validated.apk" \
            --verbose 2>&1 | tee Evidence/CI_ANDROID_EXPORT.log
          test -s Builds/Android/LordWar-1.0.1-device-validated.apk
          LORDWAR_APK="$PWD/Builds/Android/LordWar-1.0.1-device-validated.apk" python3 Tools/patch_gles_shader_uniform_limit.py
          "$ANDROID_HOME/build-tools/35.0.1/zipalign" -f 4 Builds/Android/LordWar-1.0.1-device-validated.apk Builds/Android/LordWar-1.0.1-aligned.apk
          "$ANDROID_HOME/build-tools/35.0.1/apksigner" sign --ks "$HOME/.android/lordwar-ci-debug.keystore" --ks-key-alias androiddebugkey --ks-pass pass:android --key-pass pass:android --out Builds/Android/LordWar-1.0.1-device-validated-signed.apk Builds/Android/LordWar-1.0.1-aligned.apk
          mv Builds/Android/LordWar-1.0.1-device-validated-signed.apk Builds/Android/LordWar-1.0.1-device-validated.apk
          "$ANDROID_HOME/build-tools/35.0.1/apksigner" verify Builds/Android/LordWar-1.0.1-device-validated.apk
          sha256sum Builds/Android/LordWar-1.0.1-device-validated.apk | tee Builds/Android/LordWar-1.0.1-device-validated.apk.sha256
          ls -lh Builds/Android/

      - name: Install Pillow for screenshot validation
        shell: bash
        run: python3 -m pip install --user pillow

      - name: Android emulator install and launch smoke test
        shell: bash
        working-directory: project
        run: |
          set -euo pipefail
          mkdir -p Evidence
          sudo chmod 666 /dev/kvm 2>/dev/null || true
          echo "no" | avdmanager create avd -n LordWarApi35 -k "system-images;android-35;google_apis;x86_64" --force
          nohup emulator -avd LordWarApi35 -no-window -noaudio -no-boot-anim -gpu swiftshader -memory 2048 > Evidence/CI_EMULATOR_BOOT.log 2>&1 &
          adb wait-for-device
          BOOT_OK=0
          for i in $(seq 1 120); do
            if [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then
              BOOT_OK=1
              break
            fi
            sleep 2
          done
          test "$BOOT_OK" = "1"
          {
            echo "ro.hardware.egl=$(adb shell getprop ro.hardware.egl | tr -d '\r')"
            echo "ro.hardware.vulkan=$(adb shell getprop ro.hardware.vulkan | tr -d '\r')"
            echo "ro.opengles.version=$(adb shell getprop ro.opengles.version | tr -d '\r')"
          } | tee Evidence/CI_ANDROID_GPU_PROPERTIES.txt
          adb shell settings put system accelerometer_rotation 0 || true
          adb shell settings put system user_rotation 1 || true
          adb shell wm size 640x360 || true
          adb shell wm density 160 || true
          adb shell settings put secure immersive_mode_confirmations confirmed || true
          adb shell input keyevent 82 || true
          sleep 2
          adb uninstall com.lordwar.game >/dev/null 2>&1 || true
          adb install --no-incremental -r Builds/Android/LordWar-1.0.1-device-validated.apk | tee Evidence/CI_ADB_INSTALL.log
          "$ANDROID_HOME/build-tools/35.0.1/aapt" dump badging Builds/Android/LordWar-1.0.1-device-validated.apk > Evidence/CI_ANDROID_BADGING.txt
          adb shell am force-stop com.lordwar.game || true
          adb logcat -c
          ACTIVITY="$(adb shell cmd package resolve-activity --brief -a android.intent.action.MAIN -c android.intent.category.LAUNCHER com.lordwar.game 2>/dev/null | tr -d '\r' | tail -n 1)"
          echo "resolved_activity=$ACTIVITY" | tee Evidence/CI_ANDROID_LAUNCH.log
          test -n "$ACTIVITY"
          if echo "$ACTIVITY" | grep -qi "No activity"; then exit 1; fi
          adb shell am start -W -n "$ACTIVITY" | tee -a Evidence/CI_ANDROID_LAUNCH.log
          adb shell dumpsys activity activities | grep -E "mResumedActivity|topResumedActivity|com.lordwar.game" | head -n 30 | tee Evidence/CI_ANDROID_ACTIVITY_STATE.txt || true
          START_PID=""
          for i in $(seq 1 20); do
            START_PID="$(adb shell pidof com.lordwar.game | tr -d '\r' || true)"
            if [ -n "$START_PID" ]; then break; fi
            sleep 1
          done
          echo "start_pid=$START_PID" | tee -a Evidence/CI_ANDROID_LAUNCH.log
          test -n "$START_PID"
          sleep 20
          adb exec-out screencap -p > Evidence/CI_ANDROID_DEVICE_SCREEN_BEFORE.png
          read W H < <(python3 - <<'PY'
          from PIL import Image
          im=Image.open("Evidence/CI_ANDROID_DEVICE_SCREEN_BEFORE.png")
          print(im.width, im.height)
          PY
          )
          echo "screenshot=${W}x${H}" | tee Evidence/CI_ANDROID_SCREEN_SIZE.txt
          test "$W" -gt "$H"
          adb shell input swipe $((W*75/100)) $((H*60/100)) $((W*25/100)) $((H*60/100)) 350 || true
          adb shell input tap $((W*50/100)) $((H*50/100)) || true
          sleep 20
          adb exec-out screencap -p > Evidence/CI_ANDROID_DEVICE_SCREEN.png
          adb exec-out run-as com.lordwar.game cat files/lordwar_ci_game.png > Evidence/CI_ANDROID_GAMEPLAY_CAPTURE.png || true
          echo "Waiting for four debug runtime heartbeats..."
          for i in $(seq 1 30); do
            adb logcat -d -v threadtime > Evidence/CI_ANDROID_DEVICE_LOGCAT.log || true
            HEARTBEATS=$(grep -c "LORDWAR_RUNTIME_ALIVE" Evidence/CI_ANDROID_DEVICE_LOGCAT.log || true)
            if [ "$HEARTBEATS" -ge 4 ]; then break; fi
            sleep 2
          done
          adb logcat -d -v threadtime > Evidence/CI_ANDROID_DEVICE_LOGCAT.log || true
          PID="$(adb shell pidof com.lordwar.game | tr -d '\r' || true)"
          echo "pid=$PID" | tee Evidence/CI_ANDROID_DEVICE_STATUS.txt
          adb shell ps -A | grep -F "com.lordwar.game" > Evidence/CI_ANDROID_PROCESS_LIST.txt || true
          adb shell dumpsys activity exit-info com.lordwar.game > Evidence/CI_ANDROID_EXIT_INFO.txt 2>&1 || true
          adb logcat -b crash -d -v threadtime > Evidence/CI_ANDROID_CRASH_BUFFER.log 2>&1 || true
          adb logcat -b all -d -v threadtime > Evidence/CI_ANDROID_ALL_BUFFERS.log 2>&1 || true
          adb shell dumpsys dropbox --print data_app_native_crash > Evidence/CI_ANDROID_DROPBOX_NATIVE_CRASH.txt 2>&1 || true
          adb shell dumpsys dropbox --print data_app_crash > Evidence/CI_ANDROID_DROPBOX_APP_CRASH.txt 2>&1 || true
          MENU_OK=$(grep -c "LORDWAR_MAIN_MENU_VISIBLE" Evidence/CI_ANDROID_DEVICE_LOGCAT.log || true)
          GAME_READY=$(grep -c "LORDWAR_GAME_READY" Evidence/CI_ANDROID_DEVICE_LOGCAT.log || true)
          ALIVE_COUNT=$(grep -c "LORDWAR_RUNTIME_ALIVE" Evidence/CI_ANDROID_DEVICE_LOGCAT.log || true)
          FATALS=$(grep -Ec "FATAL EXCEPTION|Fatal signal|SIGSEGV|SIGABRT|LORDWAR_STARTUP_FATAL" Evidence/CI_ANDROID_DEVICE_LOGCAT.log || true)
          PRESENT_ERRORS=$(grep -Ec "Couldn't present to Vulkan queue|VK_ERROR_DEVICE_LOST|EGL_BAD|OpenGL.*ERROR|GL_INVALID|Program linking failed|shader failed to compile|CanvasShaderGLES3|SceneShaderGLES3" Evidence/CI_ANDROID_DEVICE_LOGCAT.log || true)
          SWIFTSHADER=$(grep -c "SwiftShader" Evidence/CI_ANDROID_DEVICE_LOGCAT.log || true)
          KNOWN_SWIFTSHADER_UNIFORM=$(grep -Ec "active uniforms exceed GL_MAX_FRAGMENT_UNIFORM_VECTORS" Evidence/CI_ANDROID_DEVICE_LOGCAT.log || true)
          EFFECTIVE_PRESENT_ERRORS=$PRESENT_ERRORS
          echo "menu_ok=$MENU_OK" | tee -a Evidence/CI_ANDROID_DEVICE_STATUS.txt
          echo "game_ready=$GAME_READY" | tee -a Evidence/CI_ANDROID_DEVICE_STATUS.txt
          echo "alive_count=$ALIVE_COUNT" | tee -a Evidence/CI_ANDROID_DEVICE_STATUS.txt
          echo "fatal_markers=$FATALS" | tee -a Evidence/CI_ANDROID_DEVICE_STATUS.txt
          echo "present_errors=$PRESENT_ERRORS effective_present_errors=$EFFECTIVE_PRESENT_ERRORS swiftshader=$SWIFTSHADER known_uniform=$KNOWN_SWIFTSHADER_UNIFORM" | tee -a Evidence/CI_ANDROID_DEVICE_STATUS.txt
          grep -E "OpenGL API|Vulkan API|Compatibility|Forward Mobile" Evidence/CI_ANDROID_DEVICE_LOGCAT.log | tail -n 20 | tee -a Evidence/CI_ANDROID_DEVICE_STATUS.txt || true
          test -s Evidence/CI_ANDROID_GAMEPLAY_CAPTURE.png
          SCREEN_STATS=$(python3 - <<'PY'
          from PIL import Image, ImageStat
          im=Image.open("Evidence/CI_ANDROID_DEVICE_SCREEN.png").convert("RGB")
          st=ImageStat.Stat(im)
          print(f"{sum(st.mean)/3.0:.6f} {(sum(x*x for x in st.stddev)/3.0)**0.5:.6f}")
          PY
          )
          GAME_STATS=$(python3 - <<'PY'
          from PIL import Image, ImageStat
          im=Image.open("Evidence/CI_ANDROID_GAMEPLAY_CAPTURE.png").convert("RGB")
          st=ImageStat.Stat(im)
          print(f"{sum(st.mean)/3.0:.6f} {(sum(x*x for x in st.stddev)/3.0)**0.5:.6f}")
          PY
          )
          SCREEN_MEAN=$(echo "$SCREEN_STATS" | awk '{print $1}')
          SCREEN_STD=$(echo "$SCREEN_STATS" | awk '{print $2}')
          GAME_MEAN=$(echo "$GAME_STATS" | awk '{print $1}')
          GAME_STD=$(echo "$GAME_STATS" | awk '{print $2}')
          echo "screen_mean=$SCREEN_MEAN screen_stddev=$SCREEN_STD" | tee -a Evidence/CI_ANDROID_DEVICE_STATUS.txt
          echo "game_mean=$GAME_MEAN game_stddev=$GAME_STD" | tee -a Evidence/CI_ANDROID_DEVICE_STATUS.txt
          echo "android_emulator_game_capture_required=yes" | tee -a Evidence/CI_ANDROID_DEVICE_STATUS.txt
          if python3 -c "import sys; sys.exit(0 if float('$GAME_STD') > 2.0 else 1)"; then
            echo "visual_capture_has_variance=yes" | tee -a Evidence/CI_ANDROID_DEVICE_STATUS.txt
          else
            echo "visual_capture_has_variance=no" | tee -a Evidence/CI_ANDROID_DEVICE_STATUS.txt
          fi
          if ! python3 -c "import sys; sys.exit(0 if max(float('$SCREEN_STD'), float('$GAME_STD')) > 2.0 else 1)"; then
            echo "ANDROID_DEVICE_VISUAL=FAIL uniform/blank Android capture" | tee -a Evidence/CI_ANDROID_DEVICE_STATUS.txt
            exit 1
          fi
          if [ -z "$PID" ] || [ "$MENU_OK" -lt 1 ] || [ "$GAME_READY" -lt 1 ] || [ "$ALIVE_COUNT" -lt 4 ] || [ "$FATALS" -gt 0 ] || [ "$EFFECTIVE_PRESENT_ERRORS" -gt 0 ]; then
            echo "ANDROID_DEVICE_SMOKE=FAIL" | tee -a Evidence/CI_ANDROID_DEVICE_STATUS.txt
            exit 1
          fi
          echo "ANDROID_GAME_READY=PASS" | tee -a Evidence/CI_ANDROID_DEVICE_STATUS.txt
          echo "ANDROID_DEVICE_RUNTIME=PASS" | tee -a Evidence/CI_ANDROID_DEVICE_STATUS.txt
          echo "ANDROID_DEVICE_SMOKE=PASS" | tee -a Evidence/CI_ANDROID_DEVICE_STATUS.txt

      - name: Export signed Android 1.0.1 release APK
        shell: bash
        working-directory: project
        run: |
          set -euo pipefail
          "$HOME/bin/godot" --headless --path . \
            --export-release "Android Debug" \
            "Builds/Android/LordWar-1.0.1.apk" \
            --verbose 2>&1 | tee Evidence/CI_ANDROID_RELEASE_EXPORT.log
          test -s Builds/Android/LordWar-1.0.1.apk
          LORDWAR_APK="$PWD/Builds/Android/LordWar-1.0.1.apk" python3 Tools/patch_gles_shader_uniform_limit.py
          "$ANDROID_HOME/build-tools/35.0.1/zipalign" -f 4 Builds/Android/LordWar-1.0.1.apk Builds/Android/LordWar-1.0.1-aligned.apk
          "$ANDROID_HOME/build-tools/35.0.1/apksigner" sign --ks "$HOME/.android/lordwar-ci-debug.keystore" --ks-key-alias androiddebugkey --ks-pass pass:android --key-pass pass:android --out Builds/Android/LordWar-1.0.1-signed.apk Builds/Android/LordWar-1.0.1-aligned.apk
          mv Builds/Android/LordWar-1.0.1-signed.apk Builds/Android/LordWar-1.0.1.apk
          "$ANDROID_HOME/build-tools/35.0.1/apksigner" verify Builds/Android/LordWar-1.0.1.apk
          sha256sum Builds/Android/LordWar-1.0.1.apk | tee Builds/Android/LordWar-1.0.1.apk.sha256

      - name: Android emulator 1.0.1 release smoke test
        shell: bash
        working-directory: project
        run: |
          set -euo pipefail
          adb uninstall com.lordwar.game >/dev/null 2>&1 || true
          adb uninstall com.lordwar.game >/dev/null 2>&1 || true
          adb install --no-incremental -r Builds/Android/LordWar-1.0.1.apk | tee Evidence/CI_ADB_RELEASE_INSTALL.log
          adb shell settings put system accelerometer_rotation 0 || true
          adb shell settings put system user_rotation 1 || true
          adb shell wm size 640x360 || true
          adb shell wm density 160 || true
          adb shell settings put secure immersive_mode_confirmations confirmed || true
          adb logcat -c
          RELEASE_ACTIVITY="$(adb shell cmd package resolve-activity --brief -a android.intent.action.MAIN -c android.intent.category.LAUNCHER com.lordwar.game 2>/dev/null | tr -d '\r' | tail -n 1)"
          echo "resolved_activity=$RELEASE_ACTIVITY" | tee Evidence/CI_ANDROID_RELEASE_LAUNCH.log
          test -n "$RELEASE_ACTIVITY"
          if echo "$RELEASE_ACTIVITY" | grep -qi "No activity"; then exit 1; fi
          adb shell am start -W -n "$RELEASE_ACTIVITY" | tee -a Evidence/CI_ANDROID_RELEASE_LAUNCH.log
          RELEASE_START_PID=""
          for i in $(seq 1 20); do
            RELEASE_START_PID="$(adb shell pidof com.lordwar.game | tr -d '\r' || true)"
            if [ -n "$RELEASE_START_PID" ]; then break; fi
            sleep 1
          done
          echo "start_pid=$RELEASE_START_PID" | tee -a Evidence/CI_ANDROID_RELEASE_LAUNCH.log
          test -n "$RELEASE_START_PID"
          sleep 30
          adb exec-out screencap -p > Evidence/CI_ANDROID_RELEASE_SCREEN_BEFORE.png
          read W H < <(python3 - <<'PY'
          from PIL import Image
          im=Image.open("Evidence/CI_ANDROID_RELEASE_SCREEN_BEFORE.png")
          print(im.width, im.height)
          PY
          )
          echo "screenshot=${W}x${H}" | tee Evidence/CI_ANDROID_RELEASE_SCREEN_SIZE.txt
          test "$W" -gt "$H"
          for i in $(seq 1 4); do
            adb shell input swipe $((W*75/100)) $((H*60/100)) $((W*25/100)) $((H*60/100)) 300 || true
            adb shell input tap $((W*50/100)) $((H*50/100)) || true
            sleep 8
          done
          echo "Waiting for four release runtime heartbeats..."
          for i in $(seq 1 30); do
            adb logcat -d -v threadtime > Evidence/CI_ANDROID_RELEASE_LOGCAT.log || true
            HEARTBEATS=$(grep -c "LORDWAR_RUNTIME_ALIVE" Evidence/CI_ANDROID_RELEASE_LOGCAT.log || true)
            if [ "$HEARTBEATS" -ge 4 ]; then break; fi
            sleep 2
          done
          PID="$(adb shell pidof com.lordwar.game | tr -d '\r' || true)"
          adb exec-out screencap -p > Evidence/CI_ANDROID_RELEASE_SCREEN.png || true
          adb logcat -d -v threadtime > Evidence/CI_ANDROID_RELEASE_LOGCAT.log || true
          echo "pid=$PID" | tee Evidence/CI_ANDROID_RELEASE_STATUS.txt
          MENU_OK=$(grep -c "LORDWAR_MAIN_MENU_VISIBLE" Evidence/CI_ANDROID_RELEASE_LOGCAT.log || true)
          GAME_READY=$(grep -c "LORDWAR_GAME_READY" Evidence/CI_ANDROID_RELEASE_LOGCAT.log || true)
          ALIVE_COUNT=$(grep -c "LORDWAR_RUNTIME_ALIVE" Evidence/CI_ANDROID_RELEASE_LOGCAT.log || true)
          FATALS=$(grep -Ec "FATAL EXCEPTION|Fatal signal|SIGSEGV|SIGABRT|LORDWAR_STARTUP_FATAL" Evidence/CI_ANDROID_RELEASE_LOGCAT.log || true)
          RELEASE_PRESENT_ERRORS=$(grep -Ec "Couldn't present to Vulkan queue|VK_ERROR_DEVICE_LOST|EGL_BAD|OpenGL.*ERROR|GL_INVALID|Program linking failed|shader failed to compile|CanvasShaderGLES3|SceneShaderGLES3" Evidence/CI_ANDROID_RELEASE_LOGCAT.log || true)
          RELEASE_SWIFTSHADER=$(grep -c "SwiftShader" Evidence/CI_ANDROID_RELEASE_LOGCAT.log || true)
          RELEASE_KNOWN_SWIFTSHADER_UNIFORM=$(grep -Ec "active uniforms exceed GL_MAX_FRAGMENT_UNIFORM_VECTORS" Evidence/CI_ANDROID_RELEASE_LOGCAT.log || true)
          RELEASE_EFFECTIVE_PRESENT_ERRORS=$RELEASE_PRESENT_ERRORS
          echo "menu_ok=$MENU_OK" | tee -a Evidence/CI_ANDROID_RELEASE_STATUS.txt
          echo "game_ready=$GAME_READY" | tee -a Evidence/CI_ANDROID_RELEASE_STATUS.txt
          echo "alive_count=$ALIVE_COUNT" | tee -a Evidence/CI_ANDROID_RELEASE_STATUS.txt
          echo "fatal_markers=$FATALS" | tee -a Evidence/CI_ANDROID_RELEASE_STATUS.txt
          echo "present_errors=$RELEASE_PRESENT_ERRORS effective_present_errors=$RELEASE_EFFECTIVE_PRESENT_ERRORS swiftshader=$RELEASE_SWIFTSHADER known_uniform=$RELEASE_KNOWN_SWIFTSHADER_UNIFORM" | tee -a Evidence/CI_ANDROID_RELEASE_STATUS.txt
          grep -E "OpenGL API|Vulkan API|Compatibility|Forward Mobile" Evidence/CI_ANDROID_RELEASE_LOGCAT.log | tail -n 20 | tee -a Evidence/CI_ANDROID_RELEASE_STATUS.txt || true
          RELEASE_STATS=$(python3 - <<'PY'
          from PIL import Image, ImageStat
          im=Image.open("Evidence/CI_ANDROID_RELEASE_SCREEN.png").convert("RGB")
          st=ImageStat.Stat(im)
          print(f"{sum(st.mean)/3.0:.6f} {(sum(x*x for x in st.stddev)/3.0)**0.5:.6f}")
          PY
          )
          RELEASE_MEAN=$(echo "$RELEASE_STATS" | awk '{print $1}')
          RELEASE_STD=$(echo "$RELEASE_STATS" | awk '{print $2}')
          echo "release_mean=$RELEASE_MEAN release_stddev=$RELEASE_STD" | tee -a Evidence/CI_ANDROID_RELEASE_STATUS.txt
          echo "release_headless_visual_capture_is_evidence_only=yes" | tee -a Evidence/CI_ANDROID_RELEASE_STATUS.txt
          if python3 -c "import sys; sys.exit(0 if float('$RELEASE_STD') > 2.0 else 1)"; then
            echo "release_visual_capture_has_variance=yes" | tee -a Evidence/CI_ANDROID_RELEASE_STATUS.txt
          else
            echo "release_visual_capture_has_variance=no" | tee -a Evidence/CI_ANDROID_RELEASE_STATUS.txt
          fi
          if ! python3 -c "import sys; sys.exit(0 if float('$RELEASE_STD') > 2.0 else 1)"; then
            echo "ANDROID_RELEASE_VISUAL=FAIL uniform/blank Android capture" | tee -a Evidence/CI_ANDROID_RELEASE_STATUS.txt
            exit 1
          fi
          if [ -z "$PID" ] || [ "$MENU_OK" -lt 1 ] || [ "$GAME_READY" -lt 1 ] || [ "$ALIVE_COUNT" -lt 4 ] || [ "$FATALS" -gt 0 ] || [ "$RELEASE_EFFECTIVE_PRESENT_ERRORS" -gt 0 ]; then
            echo "ANDROID_RELEASE_SMOKE=FAIL" | tee -a Evidence/CI_ANDROID_RELEASE_STATUS.txt
            exit 1
          fi
          echo "ANDROID_RELEASE_RUNTIME=PASS" | tee -a Evidence/CI_ANDROID_RELEASE_STATUS.txt
          echo "ANDROID_RELEASE_SMOKE=PASS" | tee -a Evidence/CI_ANDROID_RELEASE_STATUS.txt

      - name: Archive exact final source used by release
        shell: bash
        working-directory: project
        run: |
          set -euo pipefail
          rm -f ../_buildsrc/LordWar-1.0.1-FinalSource.tar.gz
          tar --exclude='./.godot' --exclude='./Builds' --exclude='./Evidence' -czf ../_buildsrc/LordWar-1.0.1-FinalSource.tar.gz .
          test -s ../_buildsrc/LordWar-1.0.1-FinalSource.tar.gz
          sha256sum ../_buildsrc/LordWar-1.0.1-FinalSource.tar.gz | tee Evidence/CI_FINAL_SOURCE_SHA256.txt

      - name: Build evidence summary
        if: always()
        shell: bash
        working-directory: project
        run: |
          {
            echo "workflow_run=$GITHUB_RUN_ID"
            echo "commit=$GITHUB_SHA"
            echo "godot_version=$GODOT_VERSION"
            echo "source_sha256=$EXPECTED_SOURCE_SHA256"
            echo "timestamp_utc=$(date -u +%FT%TZ)"
            if [ -f Builds/Android/LordWar-1.0.1-device-validated.apk ]; then
              echo "debug_apk_present=yes"
              sha256sum Builds/Android/LordWar-1.0.1-device-validated.apk
            else
              echo "debug_apk_present=no"
            fi
            if [ -f Builds/Android/LordWar-1.0.1.apk ]; then
              echo "release_apk_present=yes"
              sha256sum Builds/Android/LordWar-1.0.1.apk
            else
              echo "release_apk_present=no"
            fi
          } > Evidence/CI_BUILD_SUMMARY.txt
          cat Evidence/CI_BUILD_SUMMARY.txt

      - name: Upload APK, source and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lordwar-r32-android-build
          if-no-files-found: warn
          retention-days: 30
          path: |
            project/Builds/Android/*.apk
            project/Builds/Android/*.sha256
            project/Evidence/CI_*.log
            project/Evidence/CI_*.txt
            project/Evidence/CI_*.png
            project/Evidence/CI_BUILD_SUMMARY.txt
            project/Scripts/Godot/LordWarApp.cs
            project/LordWar.sln
            project/project.godot
            bootstrap/overrides/LordWarApp.cs
            bootstrap/overrides/WorldGenerator.cs
            project/Scripts/LordWar/World/WorldGenerator.cs
            _buildsrc/lordwar-r32.tar.gz
            _buildsrc/LordWar-1.0.1-FinalSource.tar.gz
            bootstrap/overrides/BuildInfo.cs
